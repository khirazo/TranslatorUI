[project]
name = "translator-ui"
version = "0.1.0"
description = "Local web UI for streaming text translation through OpenAI-compatible LLM endpoints."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["translator_ui"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
