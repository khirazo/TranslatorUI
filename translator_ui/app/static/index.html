<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TranslatorUI</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-50">
  <main id="app" class="mx-auto min-h-screen max-w-5xl px-4 py-8">
    <header class="mb-8 text-center">
      <h1 class="mb-2 text-4xl font-bold text-blue-600">TranslatorUI</h1>
      <p class="text-gray-600">OpenAI互換 LLM による逐次テキスト翻訳</p>
    </header>

    <section v-if="providers.length > 1" class="mb-4 flex justify-center">
      <label class="flex items-center gap-2 text-sm text-gray-700">
        <span class="font-semibold">翻訳プロバイダー</span>
        <select v-model="providerId" :disabled="isTranslating" class="rounded-md border border-gray-300 bg-white px-3 py-2">
          <option v-for="provider in providers" :key="provider.id" :value="provider.id">{{ provider.name }}</option>
        </select>
      </label>
    </section>

    <section class="mb-6">
      <div class="flex justify-center">
        <button @click="showLanguageSelector = !showLanguageSelector" :disabled="isTranslating" class="flex items-center gap-2 rounded-lg bg-blue-500 px-6 py-2.5 font-medium text-white shadow-lg transition-all hover:bg-blue-600 disabled:cursor-not-allowed disabled:bg-gray-400">
          <span>{{ language(sourceLang).flag }} {{ language(sourceLang).name }} → {{ language(targetLang).flag }} {{ language(targetLang).name }}</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
      <div v-if="showLanguageSelector" class="mt-4 rounded-lg border border-gray-200 bg-white p-6 shadow-md">
        <div class="grid gap-6 md:grid-cols-2">
          <div>
            <h2 class="mb-3 text-sm font-semibold text-gray-700">原文の言語</h2>
            <div class="grid grid-cols-2 gap-2">
              <button v-for="item in languages" :key="`source-${item.code}`" @click="sourceLang = item.code" :class="sourceLang === item.code ? 'bg-blue-500 text-white' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'" class="rounded-md border border-gray-200 px-4 py-2.5 text-left text-sm font-medium transition-colors">{{ item.flag }} {{ item.name }}</button>
            </div>
          </div>
          <div>
            <h2 class="mb-3 text-sm font-semibold text-gray-700">訳文の言語</h2>
            <div class="grid grid-cols-2 gap-2">
              <button v-for="item in languages" :key="`target-${item.code}`" @click="targetLang = item.code" :class="targetLang === item.code ? 'bg-blue-500 text-white' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'" class="rounded-md border border-gray-200 px-4 py-2.5 text-left text-sm font-medium transition-colors">{{ item.flag }} {{ item.name }}</button>
            </div>
          </div>
        </div>
        <div class="mt-4 flex justify-center">
          <button @click="swapLanguages" class="rounded-md bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200">⇄ 言語を入れ替える</button>
        </div>
      </div>
    </section>

    <section class="grid gap-6 md:grid-cols-2">
      <div class="rounded-lg border border-gray-200 bg-white p-6 shadow-md">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-gray-800">{{ language(sourceLang).flag }} {{ language(sourceLang).name }}</h2>
          <button v-if="inputText" @click="clearInput" :disabled="isTranslating" title="クリア" class="text-gray-400 transition-colors hover:text-gray-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <textarea v-model="inputText" :disabled="isTranslating" :placeholder="`${language(sourceLang).name}を入力してください…`" class="min-h-64 w-full resize-y rounded-md border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        <button @click="translateText" :disabled="isTranslating || !inputText.trim()" class="mt-4 w-full rounded-md bg-blue-500 px-4 py-3 font-medium text-white transition-colors hover:bg-blue-600 disabled:cursor-not-allowed disabled:bg-gray-400">{{ isTranslating ? '翻訳中…' : '翻訳する' }}</button>
      </div>

      <div class="rounded-lg border border-gray-200 bg-white p-6 shadow-md">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-gray-800">{{ language(targetLang).flag }} {{ language(targetLang).name }}</h2>
          <button v-if="outputText" @click="copyOutput" :title="copied ? 'コピーしました' : 'コピー'" class="text-gray-400 transition-colors hover:text-gray-600">
            <svg v-if="!copied" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2m-6 12h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8Z" /></svg>
            <svg v-else xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 13 4 4L19 7" /></svg>
          </button>
        </div>
        <div class="min-h-64 whitespace-pre-wrap rounded-md border border-gray-300 bg-gray-50 p-3 text-gray-800">
          <span v-if="outputText">{{ outputText }}</span>
          <span v-else class="text-gray-400">翻訳結果がここに表示されます</span>
        </div>
        <button v-if="isTranslating" @click="stopText" class="mt-4 w-full rounded-md bg-red-500 px-4 py-3 font-medium text-white hover:bg-red-600">中止する</button>
        <p v-if="error" class="mt-4 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
      </div>
    </section>
  </main>

  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          providers: [], providerId: '', showLanguageSelector: false,
          languages: [
            { code: 'ja', name: '日本語', flag: '🇯🇵' }, { code: 'en', name: 'English', flag: '🇺🇸' },
            { code: 'zh', name: '中文（简体）', flag: '🇨🇳' }, { code: 'zh-tw', name: '中文（繁體）', flag: '🇹🇼' },
            { code: 'ko', name: '한국어', flag: '🇰🇷' }, { code: 'ar', name: 'العربية', flag: '🇸🇦' },
            { code: 'it', name: 'Italiano', flag: '🇮🇹' }, { code: 'id', name: 'Bahasa Indonesia', flag: '🇮🇩' },
            { code: 'nl', name: 'Nederlands', flag: '🇳🇱' }, { code: 'es', name: 'Español', flag: '🇪🇸' },
            { code: 'th', name: 'ไทย', flag: '🇹🇭' }, { code: 'de', name: 'Deutsch', flag: '🇩🇪' },
            { code: 'fr', name: 'Français', flag: '🇫🇷' }, { code: 'vi', name: 'Tiếng Việt', flag: '🇻🇳' },
            { code: 'ru', name: 'Русский', flag: '🇷🇺' }
          ],
          sourceLang: 'ja', targetLang: 'en', inputText: '', outputText: '', error: '',
          isTranslating: false, controller: null, copied: false
        };
      },
      mounted() { this.loadProviders(); },
      methods: {
        async loadProviders() {
          try {
            const response = await fetch('/api/providers');
            if (!response.ok) return;
            const result = await response.json();
            this.providers = result.providers || [];
            this.providerId = result.default_provider_id || '';
          } catch (error) { console.warn('Could not load translation providers.', error); }
        },
        language(code) { return this.languages.find((item) => item.code === code) || { code, name: code, flag: '' }; },
        swapLanguages() { [this.sourceLang, this.targetLang] = [this.targetLang, this.sourceLang]; },
        clearInput() { this.inputText = ''; },
        async translateText() {
          if (!this.inputText.trim()) return;
          this.isTranslating = true; this.outputText = ''; this.error = ''; this.copied = false;
          this.controller = new AbortController();
          try {
            const response = await fetch('/api/translate-text', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: this.inputText, source_lang: this.sourceLang, target_lang: this.targetLang, provider_id: this.providerId || undefined }),
              signal: this.controller.signal
            });
            if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
            const reader = response.body.getReader(); const decoder = new TextDecoder(); let pending = '';
            while (true) {
              const { done, value } = await reader.read();
              pending += decoder.decode(value || new Uint8Array(), { stream: !done });
              const lines = pending.split('\n'); pending = lines.pop();
              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const event = JSON.parse(line.slice(6));
                if (event.token) this.outputText += event.token;
                if (event.error) this.error = event.error;
              }
              if (done) break;
            }
          } catch (error) {
            if (error.name !== 'AbortError') this.error = `エラーが発生しました: ${error.message}`;
          } finally { this.isTranslating = false; this.controller = null; }
        },
        stopText() { this.controller?.abort(); },
        async copyOutput() {
          if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(this.outputText);
          this.copied = true;
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
