services:
  translator-ui:
    build:
      context: ./translator_ui
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4568:8000"
    env_file:
      - .env
    environment:
      TRANSLATOR_UI_CONFIG: /app/translator-ui.toml
    volumes:
      - type: bind
        source: ${TRANSLATOR_UI_CONFIG:-./translator-ui.toml}
        target: /app/translator-ui.toml
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
    restart: unless-stopped
